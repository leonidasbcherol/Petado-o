{% extends 'app/base.html' %}
{% block content %}
<h2>Excluir Pet</h2>
<p>Tem certeza que deseja excluir o pet <strong>{{ pet.nome }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'lista_pets' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
